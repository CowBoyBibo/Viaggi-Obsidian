name: Aggiorna statistiche Local Guide

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Livello (es. 6)"
        required: false
      points:
        description: "Punti (es. 1,7K)"
        required: false
      contributions:
        description: "Contributi (es. 464)"
        required: false
      views:
        description: "Visualizzazioni (es. 150K)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4

      - name: Aggiorna maps_stats.json
        env:
          LEVEL: ${{ inputs.level }}
          POINTS: ${{ inputs.points }}
          CONTRIBUTIONS: ${{ inputs.contributions }}
          VIEWS: ${{ inputs.views }}
        run: |
          python3 scripts/update_maps.py \
            --level "$LEVEL" \
            --points "$POINTS" \
            --contributions "$CONTRIBUTIONS" \
            --views "$VIEWS"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data/maps_stats.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "chore: aggiorna statistiche Local Guide"
            git pull --rebase origin v4
            git push origin HEAD:v4
          fi
