name: Aggiorna statistiche Local Guide

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Livello Local Guide"
        required: false
      points:
        description: "Punti"
        required: false
      reviews:
        description: "Recensioni"
        required: false
      photos:
        description: "Foto"
        required: false
      views:
        description: "Visualizzazioni (es. 160k+)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4

      - name: Aggiorna maps_stats.json
        env:
          LEVEL: ${{ inputs.level }}
          POINTS: ${{ inputs.points }}
          REVIEWS: ${{ inputs.reviews }}
          PHOTOS: ${{ inputs.photos }}
          VIEWS: ${{ inputs.views }}
        run: |
          python3 scripts/update_maps.py \
            --level "$LEVEL" \
            --points "$POINTS" \
            --reviews "$REVIEWS" \
            --photos "$PHOTOS" \
            --views "$VIEWS"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data/maps_stats.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "chore: aggiorna statistiche Local Guide"
            git pull --rebase origin v4
            git push origin HEAD:v4
          fi
